name: Picsou
options:
  bundleIdPrefix: com.picsou
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Set your Apple Developer team here (or in Xcode's Signing & Capabilities) to run on a device.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Picsou:
    type: application
    platform: iOS
    sources:
      - path: Picsou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picsou.app
        INFOPLIST_FILE: Picsou/Info.plist
        TARGETED_DEVICE_FAMILY: "1"        # iPhone
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES

  PicsouTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PicsouTests
    dependencies:
      - target: Picsou
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.picsou.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Picsou:
    build:
      targets:
        Picsou: all
    test:
      targets:
        - PicsouTests
      gatherCoverageData: false
